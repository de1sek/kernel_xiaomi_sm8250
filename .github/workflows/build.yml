name: Build Xiaomi SM8250 Kernel (Thyme)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04          # ← 改成 22.04 最稳（推荐）
    # runs-on: ubuntu-latest       # 如果想继续用 24.04，见下方方案2

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: alioth-r-oss

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 libxml-simple-perl

          # 安装旧版 ncurses 兼容库
          echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list.d/jammy-compat.list
          sudo apt-get update
          sudo apt-get install -y libtinfo5 libncurses5
          sudo rm /etc/apt/sources.list.d/jammy-compat.list

      - name: Download Proton-Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/proton-clang

      - name: Build Kernel
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="de1sek"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          # 清理
          make O=out clean 2>/dev/null || true
          make O=out mrproper 2>/dev/null || true

          # 生成配置
          make O=out thyme_defconfig

          # 关键修复：使用系统 gcc 编译 host tools，Clang 只用于 kernel
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        shell: bash

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Thyme-alioth-r-oss
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dtb.img
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
          if-no-files-found: warn
