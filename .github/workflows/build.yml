name: Build Xiaomi SM8250 Kernel (Thyme)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: alioth-r-oss

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 libxml-simple-perl

          echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list.d/jammy-compat.list
          sudo apt-get update
          sudo apt-get install -y libtinfo5 libncurses5
          sudo rm /etc/apt/sources.list.d/jammy-compat.list

      - name: Download Proton-Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/proton-clang

      - name: Build Kernel
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="de1sek"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          # Swap
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          make O=out clean 2>/dev/null || true
          make O=out mrproper 2>/dev/null || true

          make O=out thyme_defconfig

          # 禁用旧的ST触摸屏驱动
          sed -i '/CONFIG_TOUCHSCREEN_ST/d' out/.config
          echo "# CONFIG_TOUCHSCREEN_ST is not set" >> out/.config

          make O=out olddefconfig

          # 强制编译（忽略错误继续）
          make -j2 O=out \
            CC=clang \
            HOSTCC=gcc \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_DEBUG_INFO=n \
            CONFIG_DEBUG_KERNEL=n \
            CONFIG_WERROR=n \
            -k 2>&1 | tee build.log || true   # 强制继续，即使有错误
        shell: bash

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Thyme-alioth-r-oss
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: warn
