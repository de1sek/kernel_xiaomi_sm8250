name: Build Xiaomi SM8250 Kernel (Thyme)
on:
  workflow_dispatch:
jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: alioth-r-oss

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 libxml-simple-perl

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # 以分支名作为缓存 key，每次命中后自动更新
          key: ccache-thyme-alioth-r-oss-${{ github.run_id }}
          restore-keys: |
            ccache-thyme-alioth-r-oss-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache -z
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Download Proton-Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/proton-clang

      - name: Create Swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build Kernel
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="de1sek"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          make O=out clean 2>/dev/null || true
          make O=out mrproper 2>/dev/null || true

          make O=out thyme_defconfig

          

          # 修复2：禁用 BUILD_ARM64_DT_OVERLAY（runner 上没有 mkdtimg）
          # 修复3：启用 MACH_XIAOMI_THYME（ASoC 机器驱动识别设备，初始化音频路径）
          scripts/config --file out/.config \
            -d BUILD_ARM64_DT_OVERLAY \
            -e MACH_XIAOMI_THYME
          make O=out ARCH=arm64 olddefconfig

          # 修复4：cs35l41 驱动调用 xlogchar_kwrite，该符号在此树未导出，替换为空操作
          sed -i 's/xlogchar_kwrite([^;]*);/\/\* xlog stub \*\//g' \
            techpack/audio/asoc/codecs/cs35l41/send_data_to_xlog.c

          make -j$(nproc --all) O=out \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Show ccache stats
        run: ccache -s

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Thyme-alioth-r-oss
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: warn
